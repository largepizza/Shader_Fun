name: Release

# Fires on any tag matching v1.2.3 — create one with:
#   git tag v1.0.0 && git push origin v1.0.0
# Can also be triggered manually from the Actions tab.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# All three jobs build with the presets in CMakePresets.json and package with the
# `package-release` CMake target (cmake/PackageRelease.cmake). The staging file list lives
# there and nowhere else — it used to be duplicated per job here and had already drifted.

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          $v = (Get-Content VERSION).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "archive=SAT_LIGHT_SIM_v${v}_Windows" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 2026-08-15: humbletim/setup-vulkan-sdk (previously used here) builds a handful of
      # SDK repos from source, but its AVAILABLE_COMPONENTS list only covers
      # Vulkan-Headers/Loader/SPIRV-*/Glslang — it has no path to glslc (that's the
      # shaderc repo, not Glslang) at all, on any platform. That's why every job
      # (Windows/Linux/macOS) failed identically with "glslc not found" the one time this
      # workflow was actually run — not a config typo, the action structurally can't
      # produce what CMakeLists.txt requires. Switched to jakoch/install-vulkan-sdk-action,
      # which downloads LunarG's real prebuilt SDK installer (glslc included by default).
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Package
        run: cmake --build --preset windows-package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.archive }}
          path: dist/${{ steps.ver.outputs.archive }}.zip

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          echo "version=$v"                        >> $GITHUB_OUTPUT
          echo "archive=SAT_LIGHT_SIM_v${v}_Linux" >> $GITHUB_OUTPUT

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            ninja-build

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Package
        run: cmake --build --preset linux-package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.archive }}
          path: dist/${{ steps.ver.outputs.archive }}.tar.gz

  # ── macOS (universal: arm64 + x86_64) ──────────────────────────────────────
  # Pinned to macos-14 (not macos-latest) so a GitHub runner-image bump can't silently
  # change the Xcode/SDK toolchain under this job between releases.
  #
  # macos-14 runners are Apple Silicon, so a default build produces an arm64-ONLY binary.
  # That is what made the first CI build die with "bad CPU type in executable" on an Intel
  # Mac: not a signing, quarantine or dylib problem, but the kernel refusing to exec a
  # Mach-O with no slice for the host architecture — it fails before any of this app's own
  # code runs. Two things are needed to actually support older Macs, and they are
  # INDEPENDENT (fixing one still leaves the other failing):
  #
  #   1. ARCHITECTURE — CMAKE_OSX_ARCHITECTURES="arm64;x86_64" (macos-universal-release
  #      preset) builds both slices into one binary. Cross-compiling x86_64 from an Apple
  #      Silicon runner is a first-class Xcode toolchain feature, and every dependency here
  #      is built from source by FetchContent, so they inherit the setting automatically.
  #      Preferred over a macos-13 Intel runner because GitHub is retiring those images —
  #      universal keeps working from any runner Apple Silicon or not, and ships one
  #      download instead of making players pick.
  #
  #   2. DEPLOYMENT TARGET — CMAKE_OSX_DEPLOYMENT_TARGET=11.0 (set in CMakeLists.txt, and
  #      pinned again in the preset). Without it clang stamps the BUILD machine's OS
  #      version, and a macOS 14-targeted binary is rejected on Monterey (12.x) with "not
  #      supported on this version of macOS" — a *different* error from the CPU-type one,
  #      and the one that would have surfaced next had the arch been right.
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          echo "version=$v"                                  >> $GITHUB_OUTPUT
          echo "archive=SAT_LIGHT_SIM_v${v}_macOS_universal" >> $GITHUB_OUTPUT

      # See build-windows's comment: switched from humbletim/setup-vulkan-sdk, which
      # cannot produce glslc OR MoltenVK on any platform (both outside its implemented
      # component list). jakoch/install-vulkan-sdk-action installs LunarG's actual
      # prebuilt macOS SDK bundle, which includes both by default — no optional
      # components needed for either.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Configure
        run: cmake --preset macos-universal-release

      - name: Build
        run: cmake --build --preset macos-release --parallel

      # Packaging bundles $VULKAN_SDK's loader + MoltenVK next to the exe (there is no
      # system Vulkan on macOS) and writes the launcher .command — see
      # cmake/PackageRelease.cmake.
      - name: Package
        run: cmake --build --preset macos-package

      # Fails the build rather than shipping an archive that cannot run on half the target
      # machines. LunarG ships universal dylibs, but that is a property of THEIR build, not
      # something this workflow controls — if a future SDK drops the x86_64 slice, the app
      # binary would still be universal while the loader it needs is not, and the failure
      # would only show up on an Intel Mac at runtime.
      - name: Verify universal binary and bundled dylibs
        run: |
          set -euo pipefail
          d="dist/${{ steps.ver.outputs.archive }}"
          v="${{ steps.ver.outputs.version }}"; vu="${v//./_}"
          fail=0
          check() {
            archs=$(lipo -archs "$1")
            echo "  $1 -> $archs"
            case "$archs" in
              *arm64*) ;;
              *) echo "    MISSING arm64"; fail=1 ;;
            esac
            case "$archs" in
              *x86_64*) ;;
              *) echo "    MISSING x86_64"; fail=1 ;;
            esac
          }
          echo "--- architectures ---"
          check "$d/SAT_LIGHT_SIM_V_${vu}"
          for lib in "$d"/lib/*.dylib; do check "$lib"; done
          echo "--- minimum OS version stamped into the executable ---"
          otool -l "$d/SAT_LIGHT_SIM_V_${vu}" | grep -A3 LC_BUILD_VERSION | head -20
          echo "--- linked libraries (bundled ones resolve via DYLD_FALLBACK_LIBRARY_PATH) ---"
          otool -L "$d/SAT_LIGHT_SIM_V_${vu}"
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.archive }}
          path: dist/${{ steps.ver.outputs.archive }}.tar.gz

  # ── GitHub Release (attaches all three archives) ───────────────────────────
  # Only runs for an actual "git tag vX.Y.Z && git push" trigger. workflow_dispatch runs
  # (used to test the build/package steps against main without cutting a release) have no
  # tag — softprops/action-gh-release fails outright without one ("requires a tag"), so
  # this job would otherwise turn every manual test run into a failed run once the three
  # builds above succeed.
  publish:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
